<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stonebridge Botanical Placement Preview</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8f5f0;font-family:Arial,sans-serif;color:#102f4d}
.team-secondary{
  position:relative;
  overflow:visible;
  isolation:isolate;
  background:#f4eee7;
  border-top:1px solid rgba(212,200,185,.72);
  border-bottom:1px solid rgba(212,200,185,.72);
}
.team-shell{
  width:min(1120px,calc(100% - 64px));
  margin:0 auto;
  position:relative;
  z-index:2;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
}
article{padding:46px 42px}
article+article{border-left:1px solid rgba(33,49,66,.14)}
h2{font-family:Georgia,serif;font-size:2.3rem;margin:0 0 14px}
p{color:#5d6870;line-height:1.6}
.team-secondary-botanical{
  position:absolute;
  right:-6px;
  bottom:-52px;
  z-index:1;
  width:clamp(180px,13vw,240px);
  height:auto;
  pointer-events:none;
}
.cta{height:190px;background:#163b61}
</style>
</head>
<body>
<section class="team-secondary">
  <div class="team-shell">
    <div class="grid">
      <article>
        <h2>Stonebridge is growing</h2>
        <p>We are building the clinician team deliberately rather than for volume.</p>
      </article>
      <article>
        <h2>For professionals</h2>
        <p>Consultation, peer review, and education follow a separate professional pathway.</p>
      </article>
    </div>
  </div>
  <img class="team-secondary-botanical" src="team-secondary-botanical.png" alt="">
</section>
<div class="cta"></div>
</body>
</html>
