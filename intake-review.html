<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Secure Intake Review | Stonebridge Psychological Group</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260924rhythm2">
  <link rel="stylesheet" href="stonebridge-brand-sync.css?v=20260924headerfix3">
  <link rel="stylesheet" href="new-client-access.css?v=20261006a">
  <style>
    .review-shell{width:min(1080px,calc(100% - 40px));margin:0 auto;padding:44px 0 70px}
    .review-grid{display:grid;gap:22px}
    .review-card{border:1px solid rgba(15,42,69,.16);background:#fff;border-radius:16px;padding:22px}
    .review-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
    .review-row label{display:grid;gap:7px;font-weight:600}
    .review-row input{min-height:46px;padding:10px 12px;border:1px solid rgba(15,42,69,.22);border-radius:8px}
    .review-list{display:grid;gap:14px;margin-top:18px}
    .review-item{border-top:1px solid rgba(15,42,69,.12);padding-top:14px}
    .review-item:first-child{border-top:0;padding-top:0}
    .review-meta{font-size:.9rem;color:#5D5A55;line-height:1.55}
    .review-error{color:#8a2f2f;font-weight:600}
    @media(max-width:760px){.review-row{grid-template-columns:1fr}.review-shell{width:min(100% - 28px,1080px)}}
  </style>
</head>
<body>
  <main class="review-shell" id="main-content">
    <p class="access-kicker">Protected staff workflow</p>
    <h1>Secure Intake Review</h1>
    <p>This page is intended only for authorized Stonebridge staff using the protected Vercel project domain.</p>

    <div id="review-status" aria-live="polite"></div>

    <div class="review-grid">
      <section class="review-card" aria-labelledby="match-title">
        <h2 id="match-title">Match a TherapyPortal request</h2>
        <form id="match-form" class="review-row">
          <label>Email
            <input id="match-email" name="email" type="email" autocomplete="off" required>
          </label>
          <label>Date of birth
            <input id="match-dob" name="dateOfBirth" type="date" autocomplete="off" required>
          </label>
          <button class="access-btn" type="submit">Check screening</button>
        </form>
        <div id="match-results" class="review-list"></div>
      </section>

      <section class="review-card" aria-labelledby="queue-title">
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap">
          <h2 id="queue-title" style="margin:0">Items needing review</h2>
          <button id="refresh-queue" class="access-btn access-btn--secondary" type="button">Refresh</button>
        </div>
        <div id="queue-results" class="review-list"></div>
      </section>
    </div>
  </main>
  <script src="intake-review.js?v=20261007"></script>
</body>
</html>
