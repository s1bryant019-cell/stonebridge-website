name: Careers mobile overflow targeted verification
on:
  push:
    branches:
      - fix/careers-mobile-professional-link-overflow-20261028
    paths:
      - .github/workflows/careers-mobile-overflow-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser controller
        run: npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core@24
      - name: Check 375, 390, 430px layouts and record screenshots
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME_BIN"
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          import http from 'node:http';
          import path from 'node:path';
          fs.mkdirSync('careers-mobile-check', {recursive:true});
          const mime={'.html':'text/html','.css':'text/css','.js':'text/javascript','.png':'image/png','.webp':'image/webp','.jpg':'image/jpeg','.svg':'image/svg+xml'};
          const server=http.createServer((req,res)=>{
            const rel=decodeURIComponent(new URL(req.url,'http://localhost').pathname).replace(/^\/+/, '') || 'index.html';
            const file=path.resolve('.',rel);
            if (!file.startsWith(process.cwd()+path.sep) || !fs.existsSync(file) || !fs.statSync(file).isFile()) {res.writeHead(404);res.end();return;}
            res.setHeader('Content-Type',mime[path.extname(file)]||'application/octet-stream');
            fs.createReadStream(file).pipe(res);
          });
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          let failed=false;
          for(const width of [375,390,430]){
            const page=await browser.newPage();
            await page.setViewport({width,height:844,isMobile:true,hasTouch:true});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:'+server.address().port+'/careers.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>document.fonts.ready);
            const r=await page.evaluate(()=>{
              const link=document.querySelector('.team-professional-link');
              return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                linkRects:[...link.getClientRects()].map(a=>({left:a.left,right:a.right})),
                linkText:link.textContent.trim(),linkHref:link.getAttribute('href')};
            });
            await page.screenshot({path:'careers-mobile-check/careers-'+width+'.png',fullPage:true});
            console.log('CHECK',width,JSON.stringify(r),'errors',errors.length);
            if(r.overflow>1 || r.linkRects.some(x=>x.left<0 || x.right>width+1) || errors.length || r.linkText!=='Explore Student Consultation' || r.linkHref!=='for-clinicians.html')failed=true;
            await page.close();
          }
          await browser.close();await new Promise(r=>server.close(r));
          if(failed)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: careers-mobile-375-390-430-evidence
          path: careers-mobile-check/
          if-no-files-found: warn
