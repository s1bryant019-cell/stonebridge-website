name: Homepage hierarchy visual review

on:
  pull_request:
    paths:
      - 'index.html'
      - 'home-current.html'
      - 'fees-insurance.html'
      - 'services.html'
      - 'new-clients.html'
      - 'contact.html'
      - 'stonebridge-beige-refinement.css'
      - 'ops/capture-design-screenshots.mjs'
      - '.github/workflows/design-visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Five-width homepage before and after captures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency without modifying lockfiles
        run: npm install --no-audit --no-fund --no-save --no-package-lock puppeteer-core@24
      - name: Restore verified baseline into separate directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/stonebridge-baseline"
          git archive 5bf818c6e12351a73e2daafac1f8d396fb2642dd | tar -x -C "$RUNNER_TEMP/stonebridge-baseline"
      - name: Capture before and after screenshots and responsive metrics
        env:
          STONEBRIDGE_BASELINE_DIR: ${{ runner.temp }}/stonebridge-baseline
        shell: bash
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME_BIN"
          node ops/capture-design-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stonebridge-homepage-hierarchy-before-after
          path: visual-review-screenshots/
          if-no-files-found: warn
          retention-days: 30
