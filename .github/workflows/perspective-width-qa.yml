name: Perspective desktop width temporary verification
on:
  push:
    branches:
      - fix/home-perspective-desktop-text-width-20261028
    paths:
      - .github/workflows/perspective-width-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser controller
        run: npm install --no-save --no-package-lock --no-audit --no-fund puppeteer-core@24
      - name: Verify mobile untouched and desktop quotation uses available strip width
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -x "$CHROME_BIN"
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import http from 'node:http';
          import fs from 'node:fs';
          import path from 'node:path';
          fs.mkdirSync('perspective-check', {recursive:true});
          const mime={'.html':'text/html','.css':'text/css','.js':'text/javascript','.jpg':'image/jpeg','.png':'image/png','.webp':'image/webp','.svg':'image/svg+xml'};
          const server=http.createServer((req,res)=>{
            const rel=decodeURIComponent(new URL(req.url,'http://localhost').pathname).replace(/^\/+/, '') || 'index.html';
            const file=path.resolve('.',rel);
            if(!file.startsWith(process.cwd()+path.sep)||!fs.existsSync(file)||!fs.statSync(file).isFile()){res.writeHead(404);res.end();return;}
            res.setHeader('Content-Type',mime[path.extname(file)]||'application/octet-stream');
            fs.createReadStream(file).pipe(res);
          });
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          let failed=false;
          for(const width of [390,1024,1440]){
            const page=await browser.newPage();
            await page.setViewport({width,height:900,isMobile:width===390,hasTouch:width===390,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:'+server.address().port+'/index.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>document.fonts.ready);
            const data=await page.evaluate(()=>{
              const section=document.querySelector('.home-perspective');
              const inner=document.querySelector('.home-perspective-inner');
              const quote=document.querySelector('#perspective-title');
              const copy=document.querySelector('.home-perspective-copy');
              const style=getComputedStyle(quote);
              const r=e=>{const x=e.getBoundingClientRect();return {left:Math.round(x.left),width:Math.round(x.width),height:Math.round(x.height),right:Math.round(x.right)}};
              return {section:r(section),inner:r(inner),quote:r(quote),copy:r(copy),quoteMaxWidth:style.maxWidth,quoteText:quote.textContent.trim(),
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};
            });
            await page.evaluate(()=>document.querySelector('.home-perspective').scrollIntoView());
            await page.screenshot({path:'perspective-check/perspective-'+width+'.png'});
            console.log('PERSPECTIVE_CHECK',width,JSON.stringify(data),'pageErrors',errors);
            if(data.overflow>1||errors.length)failed=true;
            if(width>=1024 && (data.quote.width<650||data.quote.width<data.inner.width*0.75||data.copy.width<data.inner.width*0.75))failed=true;
            await page.close();
          }
          await browser.close();await new Promise(r=>server.close(r));
          if(failed)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perspective-width-desktop-mobile
          path: perspective-check/
          if-no-files-found: warn
