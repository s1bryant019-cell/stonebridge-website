name: Generate review-approved Stonebridge homepage WebP assets
on:
  push:
    branches:
      - perf/homepage-service-cards-webp-20261028
    paths:
      - .github/workflows/generate-homepage-webps-review.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/perf/homepage-service-cards-webp-20261028'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary asset encoder
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.3
      - name: Encode original photos without changing crops or aspect ratios
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import {statSync} from 'node:fs';
          const names = [
            'thoughtful_man_in_cozy_home_office',
            'focused_study_in_a_cozy_bedroom',
            'couples_teletherapy_in_a_cozy_living_room',
            'cozy_family_telehealth_session',
            'cozy_home_office_video_call'
          ];
          for (const name of names) {
            const input = name + '.png';
            const source = await sharp(input).metadata();
            if (source.width !== 1122 || source.height !== 1402) {
              throw new Error('Unexpected original dimensions: ' + input);
            }
            for (const width of [640, 960]) {
              const output = name + '-' + width + '.webp';
              await sharp(input).resize({width, withoutEnlargement: true})
                .webp({quality:82, effort:5}).toFile(output);
              const data = await sharp(output).metadata();
              if (data.width !== width || Math.abs(data.height / width - source.height / source.width) > 0.003) {
                throw new Error('Aspect ratio changed: ' + output);
              }
              if (statSync(output).size > 180000) {
                throw new Error('Unexpected image size: ' + output);
              }
              console.log(input, '=>', output, statSync(output).size + ' bytes');
            }
          }
          NODE
      - name: Commit only the ten generated WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- thoughtful_man_in_cozy_home_office-640.webp thoughtful_man_in_cozy_home_office-960.webp focused_study_in_a_cozy_bedroom-640.webp focused_study_in_a_cozy_bedroom-960.webp couples_teletherapy_in_a_cozy_living_room-640.webp couples_teletherapy_in_a_cozy_living_room-960.webp cozy_family_telehealth_session-640.webp cozy_family_telehealth_session-960.webp cozy_home_office_video_call-640.webp cozy_home_office_video_call-960.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add five matched pairs of compressed homepage service images"
            git push origin HEAD:perf/homepage-service-cards-webp-20261028
          fi
